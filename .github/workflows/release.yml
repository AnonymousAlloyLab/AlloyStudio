name: Release readiness
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENAI_DISABLED: '1'
jobs:
  delivery:
    name: Validate source release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Check tag matches package version
        run: python scripts/release_preflight.py
      - name: Rebuild release inputs
        run: python scripts/ci_check.py build
      - name: Check release engine
        run: python scripts/ci_check.py runtime
      - name: Prepare delivery dashboard
        if: always()
        run: python scripts/ci_dashboard.py
      - name: Upload public readiness summary only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-dashboard/index.html
            build/ci-dashboard/app.js
            build/ci-dashboard/styles.css
            build/ci-dashboard/data.json
          if-no-files-found: error
          retention-days: 30
